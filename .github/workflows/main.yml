name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache liblld-14

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip setuptools
        pip install buildozer cython==0.29.33 kivy

    - name: Setup Fresh Buildozer Spec and Build APK
      run: |
        # Remove old buildozer.spec if exists to prevent NDK conflict
        rm -f buildozer.spec
        
        # Init fresh buildozer.spec
        buildozer init
        
        # Apply correct NDK version (23b) and API versions
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        sed -i 's/android.api = 31/android.api = 31/g' buildozer.spec
        sed -i 's/# android.api = 31/android.api = 31/g' buildozer.spec
        sed -i 's/# android.ndk = 23b/android.ndk = 23b/g' buildozer.spec
        sed -i 's/android.ndk = 25b/android.ndk = 23b/g' buildozer.spec
        
        # Run Buildozer build
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: snake-game-apk
        path: bin/*.apk
